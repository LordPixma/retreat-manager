<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Retreat Portal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: #fff;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
        }
        .card {
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.4rem; margin-bottom: 0.6rem; }
        p { color: #c5c5e0; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
        button {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.5rem;
            min-height: 44px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>You're offline</h1>
        <p>We can't reach the Retreat Portal right now. Check your internet connection and try again — any details you've already loaded are still available.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
