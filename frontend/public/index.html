    <!-- Service Worker Registration -->
    <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
            try {
                const registration = await navigator.serviceWorker.register('/sw.js', {
                    scope: '/'
                });
                console.log('Service Worker registered:', registration.scope);

                // Check for updates
                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // New content available, show update prompt
                            if (confirm('New version available! Click OK to update.')) {
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                                window.location.reload();
                            }
                        }
                    });
                });
            } catch (error) {
                console.error('Service Worker registration failed:', error);
            }
        });

        // Handle controller change
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('Service Worker controller changed');
        });
    }
    </script>

    <!-- PWA Install Prompt -->
    <script>
    // Lightweight, framework-free "install this app" affordance.
    //  - Android/Chromium: capture beforeinstallprompt and surface a chip that
    //    triggers the native prompt on tap.
    //  - iOS Safari: no beforeinstallprompt, so show a one-time hint explaining
    //    the Share -> Add to Home Screen flow.
    // The chip auto-hides once installed or when already running standalone.
    (function () {
        const DISMISS_KEY = 'pwa_install_dismissed_v1';
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        if (isStandalone) return; // already installed — nothing to prompt

        let deferredPrompt = null;

        function makeChip(label, onClick) {
            if (document.getElementById('pwa-install-chip')) return null;
            const chip = document.createElement('button');
            chip.id = 'pwa-install-chip';
            chip.type = 'button';
            chip.className = 'pwa-install-chip';
            chip.innerHTML = '<i class="fas fa-circle-down"></i><span>' + label + '</span>'
                + '<i class="fas fa-xmark pwa-install-close" aria-label="Dismiss"></i>';
            chip.addEventListener('click', (e) => {
                if (e.target.classList.contains('pwa-install-close')) {
                    chip.remove();
                    try { localStorage.setItem(DISMISS_KEY, '1'); } catch (_) {}
                    return;
                }
                onClick();
            });
            document.body.appendChild(chip);
            return chip;
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            try { if (localStorage.getItem(DISMISS_KEY)) return; } catch (_) {}
            makeChip('Install app', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                const chip = document.getElementById('pwa-install-chip');
                if (chip) chip.remove();
            });
        });

        window.addEventListener('appinstalled', () => {
            const chip = document.getElementById('pwa-install-chip');
            if (chip) chip.remove();
            try { localStorage.setItem(DISMISS_KEY, '1'); } catch (_) {}
        });

        // iOS Safari fallback (no beforeinstallprompt support).
        const ua = window.navigator.userAgent;
        const isIOS = /iphone|ipad|ipod/i.test(ua);
        const isSafari = /^((?!crios|fxios|edgios).)*safari/i.test(ua);
        if (isIOS && isSafari) {
            let dismissed = false;
            try { dismissed = !!localStorage.getItem(DISMISS_KEY); } catch (_) {}
            if (!dismissed) {
                window.addEventListener('load', () => setTimeout(() => {
                    makeChip('Add to Home Screen', () => {
                        alert('To install: tap the Share button, then choose "Add to Home Screen".');
                    });
                }, 2500));
            }
        }
    })();
    </script>

    <script>
    // Emergency fix for AdminDashboard loading
    (function() {
        console.log('Checking AdminDashboard availability...');
        
        // Wait a moment for scripts to load
        setTimeout(() => {
            if (typeof AdminDashboard !== 'undefined' && !window.AdminDashboard) {
                window.AdminDashboard = AdminDashboard;
                console.log('✅ AdminDashboard fixed and registered');
                
                // If we're on admin view, reload it
                if (window.App && window.App.currentView === 'admin') {
                    window.App.loadAdminView();
                }
            } else if (!window.AdminDashboard) {
                console.error('❌ AdminDashboard component not found');
                
                // Try reloading the script
                const script = document.createElement('script');
                script.src = 'js/components/admin-dashboard.js';
                script.onload = () => {
                    console.log('Admin dashboard script reloaded');
                    if (window.App && window.App.currentView === 'admin') {
                        window.App.loadAdminView();
                    }
                };
                document.body.appendChild(script);
            }
        }, 500);
    })();
